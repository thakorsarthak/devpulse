spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: "http://localhost:8081"
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Service-Name, auth-service

        - id: ingestion-service
          uri: "http://localhost:8082"
          predicates:
            - Path=/api/ingest/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Service-Name, ingestion-service

        - id: analytics-service
          uri: "http://localhost:8083"
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Service-Name, analytics-service

        - id: ai-service
          uri: "http://localhost:8084"
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Service-Name, ai-service

        - id: notification-service
          uri: "http://localhost:8085"
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-Service-Name, notification-service

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.devpulse.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true