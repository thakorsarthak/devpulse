server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/devpulse_auth
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

#Flyway is a database migration tool.
#It helps you version, track, and automatically apply database schema changes in a controlled way.
#Think of it like Git for your database schema.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000


internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:devpulse-internal-secret-change-in-prod}