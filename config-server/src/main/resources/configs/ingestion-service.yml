server:
  port: 8082

spring:
  application:
    name: ingestion-service

  datasource:
    url: jdbc:postgresql://localhost:5432/devpulse_ingestion
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Virtual Threads - Java 21 feature
# Enables lightweight threads for high-throughput webhook processing
# This is what allows ingestion-service to handle thousands of
# concurrent webhook events without blocking OS threads
spring.threads.virtual.enabled: true